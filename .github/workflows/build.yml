name: Build Windows installer
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build MSI
        run: gradle packageMsi --no-daemon
      - name: Build portable app
        run: gradle createDistributable --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CognitiveCircuit-installer
          path: build/compose/binaries/main/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: CognitiveCircuit-portable
          path: build/compose/binaries/main/app/
